      - "package.json"
      - "scripts/local-relay.ts"
      - "scripts/smoke-ui.ts"
      - "scripts/web-bundle.ts"
      - "web/package.json"
      - "web/vite.config.ts"
      - "wrangler.jsonc"
    description: >-
      Builds the web dashboard for production (vite build in web/) and fails when the JS the first screen loads (the entry script plus every chunk it modulepreloads) is over BUDGET_BYTES (590,000) in scripts/web-bundle.ts, a budget that doesn't go up for a feature; code reached only through web/src/components/lazy.tsx doesn't count.
      It fails as well when any of Motion (motion/react, the animation library) reaches that first load, which is kept for lazy surfaces, and when web/dist carries any file over 20 MiB, which would weigh on every desktop download.
      Then ui smoke: starts the relay and the kiwi CLI as a test computer and drives the built dashboard in headless Chromium, opening every menu, popover and dialog, downloading the channel from Details any time (a transcript naming each message's number, date, time and sender, and the signed log, both named with the date and time), making the room #mobile from Details → Rooms (a taken name refused before it's sent; the room in the Rooms row and the sidebar's conversations) and renaming it #ios, then posting in #ios from its conversation (the composer says Message #ios) and finding the message there and not in #general, setting up a passkey, previewing an invite, an invite that pins a personality keeping its whole join command (the long --persona token wrapping, the short flags whole) inside its box, the tab bar's controls starting past a Mac's traffic lights and the page's sheet below the bar (Settings with data-shell="mac": the bar's first control at least --lights-w in, the sheet at least --chrome-h down), the open channel's tab marked current and ⌘\ hiding the channel's sidebar (the header's Tasks / Agents / Conversation tabs take over, it stays hidden across a reload, and the tab bar's Show the sidebar brings it back), Settings → Personalities duplicating a preset into the person's own, the Agents tab showing a lane per agent with what's next on it, Needs you as rows always in view (an agent asking in is let in from its row), an answered ask saying who chose what on the ask itself, replying inline (the reply quotes what it answers, "1 Reply" opens the thread; then three replies, each sent right after two messages, keep their quotes: an earlier send's late answer doesn't clear the reply, and a reply to a message still sending waits for its seq, checked on the reply's row once the relay's copy has landed), Details → Close channel… downloading the whole log first as JSON Lines with each message's key and signature (the history call through ChannelLink and the desktop keyring) and Cancel keeping the channel, linking a computer with `kiwi setup`, approving its agent and opening a task (a board row opens it in the Tasks panel, with no second task list behind it, and with the task open beside it at 1280 and 1180px every row keeps a readable title with nothing spilling out of it, its columns picked by the board's own width; /tasks switches to the Tasks tab; the details' wants-to-join row closes them and shows Needs you, where the agent is let in, and details offer no Copy invite link or second approve flow), a reload of that channel never showing the Add an agent card, No tasks yet or No messages yet before its history is in, the app loaded with no channel in its address reopening the one that was open instead of Nothing open, finding controls by visible names and roles; fails if a page throws while rendering, a control it looks for is renamed or missing, or the relay, pairing or join flow breaks.
      Then compiles the kiwi CLI into one Linux binary with scripts/build-cli.ts (bunfig.toml and .env autoload off), runs `kiwi --version`, runs it again from a folder whose bunfig.toml preloads a file and fails if that file ran (T1365), fails over the minified JS byte budget or if QuickJS, sql.js, turndown or domino got back in, or ajv (the MCP SDK's JSON Schema validator, which only elicitation uses and the build stubs out) got back in, and scripts/smoke-cli.ts drives the binary against a local relay (every allowed kiwi sh command compared with the source CLI, the MCP sh tool, kiwi doctor).
      Then bundles the Cloudflare worker (src/relay/worker.ts) with wrangler deploy --dry-run, failing on a Node- or Bun-only import reaching it or an invalid wrangler.jsonc.
      Headless Chromium and the apt packages it needs come from .github/actions/browser, which installs the packages from .deb files cached for this very runner image (and Playwright's browsers cached per Ubuntu release, since its WebKit is built for one) and fails the job if they can't be installed.

