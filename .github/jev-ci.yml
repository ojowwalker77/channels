      - "desktop/tsconfig*.json"
    description: >-
      Bundles the Electron shell's main, preload and channels (key process) scripts with bun build, then packages the Linux app with electron-builder --dir from desktop/package.json's build config (its electronFuses block included: appId com.kiwiinit.channels, productName Channels, executable channels-desktop). desktop/scripts/fuses.ts reads the packaged binary's (release/linux-unpacked/channels-desktop)
      Electron fuses and fails unless RunAsNode, EnableNodeOptionsEnvironmentVariable and EnableNodeCliInspectArguments are off and EnableCookieEncryption, EnableEmbeddedAsarIntegrityValidation and OnlyLoadAppFromAsar are on. desktop/scripts/size.ts fails if app.asar ships node_modules (dist/ already bundles them), if more than the English Chromium locales ship (electronLanguages), or if the packaged Linux app is over 375MB on disk or 162MB as a tar.gz.
      The bundled kiwi is packed by desktop/scripts/pack-cli.ts first (zstd level 19 on every core, checked to unpack to the same bytes), and the smoke's daemon runs from the copy the app unpacks (places of one destination started at once share one write under a unique temp name, so the app's start and an adopt never spawn a binary still being written:
      ETXTBSY on Linux; test/desktop-place.test.ts in test / unit). desktop/scripts/smoke.ts starts the packaged app under Xvfb and fails unless its window renders, the page's scripts land in the V8 code cache (kiwi-app:// registered with codeCache, so a launch after the first skips compiling them), its key process (utilityProcess.fork of dist/channels.js from app.asar) stays up and the bundled kiwi daemon answers on its socket, and fails if ELECTRON_RUN_AS_NODE=1 runs JavaScript or --inspect opens a debugger.
      Fails on a bundling or packaging error, a fuse changed or dropped, or an app that no longer starts.

