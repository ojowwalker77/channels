      - "desktop/scripts/eb.ts"
      - "desktop/scripts/smoke-eb.ts"
      - "desktop/tsconfig.eb.json"
      - "desktop/tsconfig.json"
    description: >-
      On a macOS runner (Electrobun builds only for the host it runs on), checks the Electrobun shell that is replacing Electron (issue #757).
      Builds web/dist, restores ~/.hutch (the pinned Hutch under kiwi-pinned/, Cottontail, Electrobun's core and devkit, Bun) from actions/cache keyed on desktop/electrobun-pins.json, and runs `bun run prepare:eb` up to three times, 20 s apart, within 5 minutes, so a download blip from GitHub or blackboard.sh doesn't fail the job: desktop/scripts/eb.ts downloads Hutch from the URL desktop/electrobun-pins.json pins, fails unless the archive and its files match their sha256 pins, and runs `electrobun prepare` through it (never the npm shim's unpinned install.sh fallback).
      The steps after it run with DASH_RELEASE_OFFLINE=1 and fetch nothing.
      Then `bun run typecheck:eb` in desktop/: tsc -p tsconfig.eb.json typechecks src/main-eb.ts, src/preload-eb.ts, electrobun.config.ts, eb-tests/ and the eb*.ts build scripts against the projected devkit, strict.
      Then `bun test --tsconfig-override tsconfig.eb.json ./eb-tests` runs window.kiwi over Electrobun's own createRPC on both ends, wired as preload-eb.ts and main-eb.ts wire them (rpc-eb.ts): calls reach main's handler table with their arguments, answers and errors come back, pushes reach their listener, a view off our page gets no answers and no pushes, a call that isn't the bridge's is refused, and a reloaded page never takes the previous load's replies while the old page's late messages get nothing; the keys request and frame (T437) go the same way, off our page get nothing, and a session or request that isn't one is refused before main's keys see it.
      Sessions are main's (T1230): only the session main minted for the load opens, so a thousand hellos with ids of the page's own choosing open nothing, every load gets a fresh id, a retired session's late reply never leaves main, and a page whose first frame is a keys request has its session opened before the keys see it.
      Each document is its own session (T1741): two documents that boot from one preload's id carry their own nonce and get their own sessions, so neither takes the other's reply, and main's load() retires the session at once, so nothing for the old load leaves main before the new page says hello. eb-tests/page-script.test.ts bundles the real preload and runs it in its own realm, then page script there hooks JSON.stringify, Object.prototype.toJSON, RegExp.prototype.test, Reflect.apply, the message handler's postMessage, the __electrobunHostBridge alias and globalThis: none of the hooks sees the session id or the document's nonce, the hijacked globalThis gets no frame, and window.kiwi keeps answering and hearing pushes (T1855).
      Then `bun run build:eb` (electrobun build --env=stable, through eb.ts): scripts/eb-pre-build.ts fails unless the build runs the pinned Hutch and desktop/.hutch/devkit/api hashes to its pin, and turns build/icon.icns into the iconset; before it, `scripts/build-cli.ts --js` builds the kiwi CLI as one JS file (dist/kiwi.js, about 2.6MB) instead of a second compiled Bun: the app compiles it into ~/.kiwi/bin/kiwi with its own Bun at install time (desktop/src/cli.ts:
      `bun build --compile` in a child of the app's Bun, from / with only PATH, HOME and TMPDIR, so no macro in kiwi.js runs in the process that holds the store key; then an ad-hoc codesign on macOS, which Electrobun's Bun 1.4.0 output needs to run, and a --version check before it replaces anything;
      T446); the build bundles src/main-eb.ts with the shared desktop modules it imports (ipc/handlers.ts and all the app's calls through host-eb.ts, guard.ts csp(), open.ts, eb-page.ts, eb-bridge.ts, rpc-eb.ts, window-look.ts, window-size.ts) and @kiwi/core, and src/preload-eb.ts as the preload view; scripts/eb-post-build.ts copies dist/kiwi.js into the app's Resources (failing if it's missing), runs pageWithCsp on the built web/dist/index.html (fails unless only a doctype, <html> and <head> come before the CSP's place), puts that template at Resources/app/page/ outside views/, copies the rest of web/dist into views/internal and fails if an index.html lands there, compiles native/macos/kiwi-shell.m with clang -Wall -Werror into Contents/MacOS (the patch that denies the microphone, camera and location Electrobun grants the page, lets only the page's own blob:/data: downloads through, cancels every navigation but views://internal/index.html and its #/? forms in Electrobun's own navigation delegate, before load, whatever rules the page's internal RPC sets, records each committed navigation's URL natively so the bridge answers only while the view is on our page whatever events the page posts (T1855), and sets the window's minimum size and background), fails if any Electrobun file in the app differs from its pin or Contents/MacOS holds a file nobody pinned, fails when the app's Info.plist names no CFBundleIdentifier or its kiwi:// registration doesn't fit that id (only the release id, com.kiwiinit.channels, registers kiwi://; a dev or test build never does), bundles src/keys-worker.ts into app/bun/keys.js beside the main bundle and fails unless that bundled keys worker answers a page's request, then checks the bundle (scripts/eb-bundle.ts): the main bundle holds exactly one copy of Electrobun's internal RPC table, the one lockInternalRpc empties, the preload bundle exists and has no WebSocket, and the main bundle takes the launcher's key channel (launcherKeys = keySources(), from launcher-channel-eb.ts) before any other code runs: the launcherKeys declaration itself must call keySources()
      src/main-eb.ts only orders startup; each part is its own module it imports (native-eb.ts for libkiwi-shell and Electrobun's core, window-eb.ts for the window, the page, the bridge, the canary and the tripwire, keys-start-eb.ts, store-open-eb.ts for the store this build opens, test-build-eb.ts, life-updates-eb.ts for app life and updates, keep-alive-eb.ts for the stopped-page watch (registered before the window) and the daemon keeper), with launcher-channel-eb.ts imported first so it takes the store key before anything else runs, and its imports_from closure covers them.
      (a bare declaration means Bun wrapped the module in __esm, as it does when it's also import()ed, and its place no longer says when it runs), every top-level statement before it is a declaration, a constant or the bundler's lazy wrapper (parsed with oxc-parser), and every import in the bundle is a builtin, since an import runs before everything, so an import put above it in main-eb.ts fails the build instead of leaving fd 3 to a child (T1710).
      We ship the plain app, not Electrobun's self-extracting wrapper (which would run the app from a folder the user's rights can edit): desktop/scripts/eb-size.ts unpacks the plain .app from the build's .app.tar.zst payload, makes its dmg (hdiutil ULMO) and its zip (ditto, the updater's layout), and fails if that .app is over 100MB on disk or its dmg or zip is over 40MB (about 24MB and 30MB with kiwi.js; the bundled 19MB kiwi.zst had pushed the zip to about 47MB); the wrapper's sizes are only printed.
      Fails on a type error, a bundling error (an import the Bun main process can't resolve), an ObjC warning or a WebKit/AppKit API that no longer exists, a missing web/dist, or an app over its size gates.
      The plain .app's CFBundleExecutable is our launcher (desktop/native/macos/kiwi-launcher.c, built by eb-post-build.ts with clang -Wall -Wextra -Werror), not Electrobun's: it keeps only HOME, USER, LOGNAME, TMPDIR, PATH, SHELL, LANG, LC_*, XPC_SERVICE_NAME, XPC_FLAGS and __CF_USER_TEXT_ENCODING, sets BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 itself (so a forged entry in Bun's transpiler cache under HOME can't replace main's code), and execs Electrobun's launcher with that, so BUN_OPTIONS (--preload), BUN_INSPECT (a debugger), NODE_*, DYLD_* and JSC_* never reach the bun process that runs main and the web view (T632). desktop/scripts/eb-seal-check.ts builds a probe bundle whose executable is native/macos/kiwi-keys.c's kiwi_seal_check, seals it with scripts/eb-seal.ts, and fails unless it starts as sealed and with a ticket stapled into Contents/CodeResources afterwards, and is refused once a sealed file (MacOS/CodeResources included) changes or an unsealed file is added: the launcher's C check and the TS seal held to the same rules. desktop/scripts/eb-env-check.ts unpacks the plain .app and fails if the launcher, run in front of a stand-in that writes down its environment, passes on any name beyond those (it sets one from each family, and KIWI_EB_DRIVER, KIWI_EB_RELAY and CFFIXED_USER_HOME, which only a test build's launcher may pass) or drops one of them, or doesn't set BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 once whatever the caller gave, or if the running app, started with BUN_OPTIONS --preload, BUN_INSPECT on a free port, NODE_OPTIONS --require, DYLD_INSERT_LIBRARIES and HOME pointing at a forged transpiler cache entry for its own index.js (made with the app's bun, its length and wyhash rewritten), runs the preload or the forged code, listens on that port, or loads the library into any process but the unsigned launcher itself (a signed build's hardened runtime stops that one), or leaves anything running; it starts a release-id app only on CI, never on a person's Mac.
      The launcher also holds the store key (T544, desktop/native/macos/kiwi-keys.c): before it starts anything it checks every file in Contents (but Info.plist, _CodeSignature and itself) against the SHA-256 list scripts/eb-seal.ts writes into Info.plist as KiwiSeal (at the end of eb-post-build.ts for dev builds; a stable build's Resources/version.json gets its hash from Electrobun after that hook, so the shipped plain .app is sealed once it's out of the payload, by scripts/eb-app.ts shippedApp, which eb-size, eb-env-check and eb-keys-check use, as T443's packaging will between signing the nested code and the app), and refuses a changed, missing or unlisted file or a link (247 files in about 60 ms on an M2); then it starts Electrobun's launcher from / with posix_spawn and CLOEXEC_DEFAULT, so only stdio and a socketpair on fd 3 (KIWI_KEY_FD=3) get through, and answers bun's requests there (desktop/src/launcher-key.ts): the store key from the Keychain under the bundle id, made only when none is there and never replaced, and the old Electron app's key for a name in Info.plist's KiwiLegacyNames only, for one session: bun's done (or the end of the socket) shuts it, so Electrobun's launcher's copy of fd 3 gets nothing after. bun copies the channel off fd 3 onto a descriptor opened O_CLOEXEC and closes fd 3 at once, and drops KIWI_KEY_FD from process.env and the C environment (unsetenv), so nothing the app starts inherits either (T873). desktop/scripts/eb-keys-check.ts takes a copy of the plain .app with a probe (scripts/eb-keys-probe.ts) as main.js, a throwaway bundle id and a throwaway legacy item, resealed, and fails unless a descriptor the launcher inherited never reaches bun, bun has no fd 3 and no KIWI_KEY_FD once it holds the channel, its copy of the channel is close-on-exec (fcntl F_GETFD) and a child started through libc system() while the channel is open gets no socket and no KIWI_KEY_FD, another copy of the socket gets nothing after done, a child started afterwards gets no socket and no KIWI_KEY_FD, the first start makes a key through the launcher (not marked ready until finish, then marked) and the next gets the same one, still marked, and can't take it back with drop (T1076), a second key is refused, the legacy key comes through while an unlisted name and an unknown request are refused; that store v2 opens on the Mac as main-eb opens it (scripts/eb-store-probe.ts as main.js, taking the key channel in its first import, then store-eb.ts's openEbStore with its own throwaway Electron folder): a first start makes a sealed store and a key marked ready, the next reads it back with the same key, and with both copies deleted and a plain Electron store planted it's refused as a deleted store with nothing written, and, on CI's temporary keychain only, Electron's kiwi-store.bin is imported once through a kiwi-desktop key (T1582); and copies with a changed main.js, a bunfig.toml beside bun, an app.asar, a link or a missing file all stop before bun runs, and unless the launcher's check of the whole app takes 500 ms or less (median of 7), and unless, built with -fsanitize=address,undefined -fno-sanitize-recover=all into a throwaway sealed bundle, native/macos/kiwi-keys-test.c's parser cases (malformed, truncated, oversized, unknown, a NUL inside, done ending the session, many requests in one write, the ready mark's finished, finish and drop (finish naming the key it marks by its SHA-256 and refused for any other; drop only for a key made in that session, never once it's marked ready, and, in a live session, never for a key put in its place, as it deletes by the item reference SecItemAdd gave; a mark left by a key deleted by hand not counting for the next), and 1500 seeded random sessions), the seal check on a sealed and on a changed app, and the launcher itself all run with no sanitizer report, and the harness says that drop deleted the key its session made and left one put in its place (deleting by item reference); on GitHub Actions (CI, GITHUB_ACTIONS and an absolute RUNNER_TEMP, never on a developer's Mac) it uses a temporary keychain, where a second throwaway keychain in the search list holds a store key of the same name and the harness's decoy session makes its own key and takes it back by reference, leaving that one (T1710); it deletes its items either way. eb-env-check runs the launcher inside a small sealed bundle and expects KIWI_KEY_FD as the one name it adds.
      Then it starts the app, without CDP (WebKit has none;
      T442): a second build, `electrobun build --env=dev` through desktop/scripts/eb.ts (the pinned Hutch, as every build) with CHANNELS_EB_TEST=1 and its own bundle id (com.kiwiinit.channels.test), compiles in the test driver (desktop/src/eb-driver.ts behind the KIWI_EB_TEST build-time define in electrobun.config.ts), and its launcher (built with -DKIWI_EB_TEST) also lets KIWI_EB_DRIVER, KIWI_EB_RELAY and CFFIXED_USER_HOME through: with KIWI_EB_DRIVER set, main listens on that Unix socket, runs each function it's sent in the page with executeJavascript and hands back what the page posts on Electrobun's host bridge;
      KIWI_EB_RELAY sets the relay in the test build's store (so the page's CSP and window.kiwi.relayUrl, from #791's bridge, both name the local relay), and the test build keeps its store as plain JSON (desktop/src/eb-test-store.ts: kiwi-eb-test-store.json, 0600 in a 0700 folder through guard.ts writePrivate, a torn or non-object file refused whole) where the release build keeps only memory, so a relaunch reopens the channel; the test build's launcher holds the store key as the release one does. desktop/scripts/eb-driver-check.ts (its marks in desktop/scripts/eb-test-marks.ts, which its --release half applies to the files the release jobs ship) fails if the shipped release .app (unpacked and sealed by eb-app.ts shippedApp) carries the driver, the relay override or the plain-JSON store in its code (kiwiDriver, KIWI_EB_DRIVER, KIWI_EB_RELAY, kiwi-eb-test-store.json) or lets them or CFFIXED_USER_HOME through its launcher, or if the test build lacks any of them, or if either build lacks what every build has (views://internal/index.html and restoreWindowFocusAfterExternalDrop in its code, BUN_RUNTIME_TRANSPILER_CACHE_PATH in its launcher), which would mean it read the wrong files.
      A CHANNELS_EB_TEST=1 build is always com.kiwiinit.channels.test, and eb-post-build.ts refuses one built for the stable or canary channel; the test build won't start unless its data folder is under the temp CFFIXED_USER_HOME it was given, and its driver listens only in a folder only this user can open, never over a file that isn't a socket, and removes the socket on exit. desktop/scripts/smoke-eb.ts (it also has the page navigate to views://internal/icon.svg, views://internal/index.html?x=1 and file:///etc/hosts, and fails unless each is refused: the page stays on views://internal/index.html and window.kiwi still answers, which the rules the canary proved, the native allowlist and the one strict notion of our page (exactly views://internal/index.html, with an optional #fragment, in PAGE_RULES, isPageUrl, the bridge's onOurPage, kiwi-shell.m and Linux's kiwi-shell.c) all have to hold for; through desktop/scripts/eb-drive.ts, ~/Library and HOME in one temp home, since Bun follows HOME, a local relay) fails unless the window shows the dashboard from views://internal/index.html with a first paint, the relay it was given reaches the page as window.kiwi.relayUrl and answers through the CSP, an inline script and a fetch to another origin are refused, the microphone isn't granted, the kiwi daemon answers on the test KIWI_HOME, the kiwi CLI is installed in the test HOME's .kiwi/bin, killing every web content process of the app's own brings the page back with a line in main.log (T439), and nothing of the app is left running after it quits; with desktop/scripts/eb-bridge-checks.ts (T1240) it also fails unless window.kiwi answers our page, page calls to Electrobun's internal webviewTag RPC (ExecuteJavascript, SetNavigationRules, UpdateSrc) and a link to about:blank leave the title and location as they were, a local client on Electrobun's 127.0.0.1 RPC socket connected as our view gets nothing while the page is pushed to three times and its requests never reach the store, a did-commit-navigation the page posts itself doesn't turn the bridge off, a page that replaces globalThis gets none of main's frames, and after the page's own location.reload() the new document is answered.
      Then, through desktop/scripts/eb-first-run.ts (which scripts/perf-desktop.ts also uses when timed by hand), it makes a person, a channel and one message on the local relay (the name field, Continue, New channel, Create channel, the composer and Enter) and fails unless the message shows in the conversation; on Linux it only reports it until T92, since Create channel there hasn't made the channel under Xvfb since 0.27.0.
      Electrobun has its own cold-start gate, electrobunColdStartMs at 1300 ms, because on CI its dev test build scales to 900-1070 ms where Electron scales to about 680 (coldStartMs, gate 905):
      T798 finds why, times the stable build, and brings it under 905, then the gate tightens to match.
      Its first-screen gate, electrobunFirstScreenMs, is 1000 ms for the same reason (600-875 ms scaled on CI, against Electron's 745).

  desktop-linux:
    name: desktop / linux
    inputs:
      - "bun.lock"
      - "desktop/build/icons/**"
      - "desktop/eb-tests/**"
      - "desktop/native/linux/**"
      - "desktop/src/**"
      - "package.json"
      - "packages/core/**"
      - "scripts/build-cli.ts"
      - "scripts/local-relay.ts"
      - "src/**"
      - "src/relay/**"
      - "web/index.html"
      - "web/package.json"
      - "web/src/**"
    imports_from:
      - "desktop/scripts/smoke-eb.ts"
      - "desktop/src/main-eb.ts"
      - "desktop/src/preload-eb.ts"
    always:
      - "desktop/electrobun-pins.json"
      - "desktop/electrobun.config.ts"
      - "desktop/native/linux/**"
      - "desktop/package.json"
      - "desktop/scripts/appimage-squashfs.ts"
      - "desktop/scripts/eb-drive.ts"
      - "desktop/scripts/eb-driver-check.ts"
      - "desktop/scripts/eb-linux-start.sh"
      - "desktop/scripts/eb-pins-check.ts"
      - "desktop/scripts/eb-pins.ts"
      - "desktop/scripts/eb-post-build.ts"
      - "desktop/scripts/eb-pre-build.ts"
      - "desktop/scripts/eb.ts"
      - "desktop/scripts/linux-files.ts"
      - "desktop/scripts/linux-packages-check.sh"
      - "desktop/scripts/linux-store-check.ts"
      - "desktop/scripts/linux-upgrade-check.sh"
      - "desktop/scripts/package-linux.ts"
      - "desktop/scripts/smoke-eb.ts"
    description: >-
      On two runners at once, Ubuntu 24.04 and 26.04 (a matrix, each part saving its own jev-ci pass;
      T2119: on 24.04 AppArmor's unprivileged user-namespace restriction keeps bubblewrap from setting up its loopback, so WebKitGTK's sandbox can't start there)
      (Electrobun builds only for the host it runs on), builds the Electrobun shell for Linux on WebKitGTK (issue #757, T444): web/dist, `bun run prepare:eb` (Hutch's devkit, cached under ~/.hutch), then `bun run build:eb` (electrobun build --env=stable), both through desktop/scripts/eb.ts, which runs only the Hutch desktop/electrobun-pins.json pins for this host (its archive and files checked by sha256), and desktop/scripts/eb-pins-check.ts linux-arm64 downloads the linux-arm64 Hutch archive and Electrobun's linux-arm64 core archive (only hashing them, never running anything) and fails unless the archive, its three files and the core's api tree match desktop/electrobun-pins.json, since no job builds on linux-arm64; scripts/eb-pre-build.ts fails unless the build runs that Hutch and desktop/.hutch/devkit/api hashes to its pin (the same tree for macOS and Linux) and makes the Mac iconset only on macOS, and scripts/eb-post-build.ts puts web/dist/index.html (checked by pageWithCsp) at Resources/app/page/ and the rest of web/dist in Resources/app/views/internal on either OS (the Mac's native shell, launcher and app-file pins only on macOS); on Linux it renames Electrobun's bin/launcher to bin/electrobun-launcher and compiles native/linux/kiwi-launcher.c into bin/launcher with cc -Wall -Wextra -Werror, so the entry, /usr/bin/channels-desktop and the AppImage's AppRun all start ours, which keeps the environment to an allowlist (the session, locale, input method, proxies, the AppImage's own names, WebKit's DISABLE switches) and sets BUN_RUNTIME_TRANSPILER_CACHE_PATH=0 before it execs Electrobun's (T1548).
      Then desktop/scripts/linux-store-check.ts runs the app's store (store-eb.ts openEbStore with keySources' Linux keychain key) twice: inside dbus-run-session with a throwaway gnome-keyring unlocked, it plants the Electron app's kiwi-desktop Safe Storage password under Chromium's libsecret schema and its v11 kiwi-store.bin, and fails unless the first start imports it sealed under a store key the keyring keeps with its ready mark, both copies at 0600, the next start reads store v2 without importing again, and the old file stays; with no session bus, it fails unless the store opens in plain JSON at 0600 with the reason main.log gets (T1550).
      Then desktop/scripts/package-linux.ts makes today's two Linux downloads from Electrobun's plain stable artifact (never its self-extracting setup), without Electrobun's updater tools (bspatch, zig-zstd: only its Updater uses them, and these packages update as a whole file), its uninstall tool or its own Channels.desktop:
      Channels-<v>-linux-amd64.deb (package kiwi-desktop, so it replaces the Electron one, the app in /opt/Channels, /usr/bin/channels-desktop, a .desktop entry opening kiwi:// links, the hicolor icons, Depends on libwebkit2gtk-4.1-0, libgtk-3-0, libayatana-appindicator3-1, librsvg2-2, bubblewrap and xdg-dbus-proxy (WebKitGTK's sandbox), md5sums, an entry that runs /opt/Channels/bin/launcher, a preinst that drops the Electron deb's channels-desktop alternative and a postinst that restores the link if an old postrm took it) and Channels-<v>-linux-x86_64.AppImage (zstd squashfs in 128 KiB blocks on AppImage's type2 runtime, release 20251108 checked against its pinned sha256), and fails when either is over 40 MB. desktop/scripts/linux-packages-check.sh (which the release's desktop-linux-eb job runs too): scripts/appimage-squashfs.ts checks the AppImage's compression, and the job fails when the deb or the extracted AppImage lacks either launcher, Bun, Resources/kiwi.js (the kiwi CLI the app installs and its daemon keeper starts: scripts/build-cli.ts --js builds dist/kiwi.js before the build, and eb-post-build copies it on either OS, T2317), the page template (Resources/app/page/index.html), the page's assets, the .desktop entry or the icon, or carries what it leaves out (an index.html under views/ among it), or when the built bin/launcher, put in front of env, passes on LD_PRELOAD, LD_LIBRARY_PATH, BUN_OPTIONS, NODE_OPTIONS or GTK_MODULES (T1548). desktop/scripts/linux-upgrade-check.sh (the release runs it too) then installs the v0.26.0 Electron deb (pinned by sha256) and this deb over it, and fails unless /usr/bin/channels-desktop leads to /opt/Channels/bin/launcher, the Electron app is gone, the entry runs the launcher and dpkg --verify finds nothing; it prints the runner's AppArmor user-namespace setting for WebKitGTK's sandbox.
      The job's apt packages come from .debs cached under the runner image's key (as .github/actions/browser does); the apt step has 15 minutes, and what it downloaded is saved even when it runs out of time, so a slow mirror costs one run, not every run.
      Then it starts the installed app (T1545): desktop/native/linux/kiwi-shell.c, built by eb-post-build into the bundle's bin as libkiwi-shell.so, is what main-eb.ts loads on Linux too. desktop/native/linux/kiwi-shell-test.c (run under Xvfb against the installed library, loaded after gtk_init as the app loads it) fails unless the program name and class are channels-desktop (the Wayland app_id, which matches channels-desktop.desktop), a microphone request on mock capture devices is denied (NotAllowedError) while a handler connected first to allow everything, as Electrobun's Allow/Block dialog is, never runs, a terminated web process reaches kiwi_watch_page's callback, kiwi_guard_downloads and kiwi_allow_only (T2071, as the Mac's from #776) hold even behind a handler that uses every navigation: the view stays on its page through a load elsewhere, a window.open and a target=_blank link (whether a window opens is Electrobun's create handler's call, which hands it to main as new-window-open, as on the Mac), an http: download is cancelled, the page's data: downloads are saved (counted only when they finish without failing: a cancelled one also emits finished) and a data: navigation becomes a download, not a page; kiwi_committed_url gives the page's committed URL (the bridge's trust check, from load-changed's commit as the Mac's from didCommitNavigation), and kiwi_sandbox_pages, asked from another thread, turns WebKitGTK's bubblewrap sandbox on for the default context before its first web view once a trial bwrap --unshare-all builds its namespaces (on 26.04), or leaves it off and says why (on 24.04, where it can't:
      WebKit's web process would otherwise die in bwrap's loopback setup and abort the app; also off without bwrap or xdg-dbus-proxy on PATH; main-eb prints the reason and writes it to main.log). desktop/scripts/eb-linux-start.sh then starts /opt/Channels/bin/launcher under Xvfb with a temp HOME and fails unless a window with WM_CLASS Channels (Electrobun's own class, the entry's StartupWMClass) titled Channels opens within 30 s, a WebKitWebProcess of the app's own runs 5 s later inside a bwrap of the app's own on 26.04, and on 24.04 without one while the app says why, its rules canary was reported refused (the app quits otherwise) and its download and navigation guards installed (T2071), the app is still up, and nothing of it is left 10 s after SIGTERM; it starts the AppImage (--appimage-extract-and-run) the same way.
      On 26.04 it then drives the app as desktop / mac does (T1552): a test build (`bun scripts/eb.ts build --env=dev` with CHANNELS_EB_TEST=1, which gets the .test id), desktop/scripts/eb-driver-check.ts (on Linux against the installed deb in /opt/Channels: no test driver, relay override or plain-JSON test store in its code, all three in the test build's), desktop/scripts/smoke-eb.ts under Xvfb (eb-drive.ts starts a Linux app folder's bin/electrobun-launcher, since bin/launcher keeps KIWI_EB_* out of the environment, with HOME and the XDG dirs in a temp root; its web-process check stops WebKitWebProcess and reads main.log under .local/state, and the kiwi daemon must answer on the test KIWI_HOME and the kiwi CLI be installed in the test HOME's .kiwi/bin, as on the Mac, T2317).
      Then dpkg --purge must leave nothing behind: no /opt/Channels, /usr/bin/channels-desktop, entry or icons; the v0.26.0 deb is fetched into RUNNER_TEMP, so it is never uploaded.
      A last step, which only prints and never fails, records what bwrap can do under the runner's AppArmor (the restriction, the profiles naming bwrap or userns, and bwrap and unshare -Urn with and without a scratch unconfined profile granting userns), for a deb profile that brings the sandbox to 24.04 later.
      Each image's packages are kept as linux-packages-<image> for 3 days.

  cli-macos:
    name: cli / macos
    inputs:
      - ".github/workflows/release-build.yml"
      - "bun.lock"
      - "bunfig.toml"
      - "desktop/build/entitlements.app.plist"
      - "desktop/build/entitlements.cli.plist"
      - "desktop/src/**"
      - "package.json"
      - "packages/core/**"
      - "site/install"
      - "site/install.sh"
      - "src/**"
      - "test/**"
      - "web/package.json"
    always:
      - "scripts/build-cli.ts"
      - "scripts/ci-flows.ts"
      - "scripts/ci-shards.ts"
      - "scripts/ci-tests.ts"
      - "scripts/cli-bundle.ts"
    question: >-
      Could this change to `file` make the job described in `job` fail on macOS, or fail to
      cross-compile a darwin target, while the same tests and the Linux build pass
      in test / unit, test / flows-a, test / flows-b and build / bundles?
    criteria:
      true: >-
        The change touches behavior that differs on macOS: tmp paths behind the /var to
        /private/var symlink, realpath or process.cwd() compared with a tmp path, home under
        /Users, a case-insensitive file system, a unix socket path near 104 bytes, BSD shell
        tools, signals, child processes, file watching, the name the CLI prints for itself, or
        the darwin build targets, in a way that could fail only there.
      false: >-
        The change behaves the same on macOS as on Linux: a failure it causes would fail the
        Linux jobs too, which catch it, or it can't fail at all.
    description: >-
      On three macOS runners at once (a matrix of `scripts/ci-tests.ts all --shard=N/3`, which deals the files out by their times in test/timings.json: the slowest each file has taken in a cli / macos run (from `scripts/ci-tests.ts all --shard=N/3 --update-timings` or the run's log), so the heavy flows that slow each other on one runner land apart; every group also hands bun that file so --parallel starts the slowest files first), with Homebrew's tmux installed first (3.7 or newer, so the tmux tests and kiwi loop --harness kimi's typed-prompt flow run here, which the Linux runner's tmux 3.6a skips), does what the release's cli job does: runs the whole bun test suite (every test/*.test.ts and web/src test, the agent flows included) with bun test --parallel so each file gets a fresh global as on Linux (one process for every file once let a test's SIGINT end the run early, exit 0, after 128 of 328 files), and fails when a shard's run ends before every file it was dealt ran.
      The first shard then compiles the kiwi CLI for darwin-arm64, darwin-x64, linux-x64 and linux-arm64 with scripts/build-cli.ts (with bunfig.toml and .env autoload off), ad-hoc signs the macOS binaries and runs `kiwi --version`, then runs it again from a folder whose bunfig.toml preloads a file and fails if that file ran (T1062).
      The same tests run on Linux in test / unit, test / flows-a and test / flows-b, so this job is for what fails only on macOS: paths (os.tmpdir() is under /var, a symlink to /private/var, so process.cwd() and realpath spell a folder differently from mkdtemp; home is under /Users; the file system ignores case; a unix socket path is capped at 104 bytes), how the CLI names its own command in the text it prints, BSD versions of shell tools, process, signal and file-watching differences, and a build target that fails to compile. test/desktop-entitlements.test.ts signs stand-in apps with codesign here, so release-build.yml's entitlements check runs for real only on macOS.
      Fails if any test fails on macOS or a target doesn't build.
      Each shard saves its own jev-ci pass (shard1of3 and so on, given a minute so a hung cache save can't hold it), and the plan counts the job passed on its inputs only once all three have, each from main or this pull request (passMarkers in .github/jev-ci/github.ts, test/jev-ci.test.ts).

  ios:
    name: ios / build
    inputs:
      - "bun.lock"
      - "desktop/package.json"
      - "ios/**"
      - "package.json"
      - "web/package.json"
    imports_from:
      - "ios/engine/main.ts"
    always:
      - "packages/core/package.json"
    description: >-
      On a macOS runner with the newest Xcode installed there, checks the iPhone app in ios/. swift-format lint --strict (ios/.swift-format: 4-space indent, 180 columns, lowerCamelCase names, no force unwraps or force try) over ios/Channels and ios/ChannelsUITests.
      Then xcodebuild builds the Channels scheme for generic iOS devices, Release, unsigned: the Swift sources (SwiftUI, Swift 6 with complete strict concurrency, so a value that isn't Sendable crossing an actor fails), the asset catalog, and the "Bundle the engine" build phase, which runs bun build on ios/engine/main.ts (browser target, IIFE) into the app.
      The engine imports @kiwi/core, the desktop's Keyring, seats and bridge types, and a few pure web/src/lib modules (asks, harness names, presence, base-plan, fold-roster, trim, preview, task-actions), so a change there that breaks the bundle fails here.
      Fails on a lint finding, a Swift compile error, a missing asset or Info.plist key the build needs, or a bundle error.
      It does not run the app or the engine.
      Of the dependency manifests, the bundle takes only effect (desktop/src/keyring.ts and the web/src/lib modules import it) and the @kiwi/core workspace's exports map from them: a change to another package, a script, the Electron build settings in desktop/package.json or a desktop-only dependency (Electron, Electrobun) in bun.lock doesn't reach the iPhone app.

  ios-gestures:
    name: ios / gestures
    inputs:
      - "bun.lock"
      - "desktop/package.json"
      - "ios/**"
      - "package.json"
      - "web/package.json"
    imports_from:
      - "ios/engine/main.ts"
      - "ios/scripts/fixture.ts"
    always:
      - "packages/core/package.json"
    description: >-
      On a macOS runner with the newest Xcode, boots an iPhone simulator on the newest iOS runtime installed and runs the Channels scheme's tests: ios/ChannelsUITests, XCUITest driving the Debug app with real touches.
      The target's "Make the fixture" build phase runs ios/scripts/fixture.ts, which folds a signed log of twelve messages (six long ones from agents) and writes the engine's own roomView of it, so the canned channel always has the wire shape the app decodes; a Debug build given it in CHANNELS_FIXTURE shows that channel instead of reading the keychain (ios/Channels/Model/AppModel.swift).
      GestureTests opens the channel from the list eight times, fresh each time, and 0.3 or 0.8 s after the tap drags 200 pt down from the middle right of the screen, on a message bubble: every drag has to scroll the conversation more than 100 pt (a SwiftUI DragGesture on each row swallowed about half of them right after opening: 0 pt), and so does the same drag beside the bubbles.
      Swiping a bubble right has to start a reply ("Reply to …" in the composer) without leaving the conversation (the Rightward pan in Conversation.swift).
      The drags' distances are printed as GESTURE lines.
      Fails on a compile error in the app or the tests, a fixture the app can't decode, or any of those gestures failing.
      Of the dependency manifests, the engine and the fixture take only effect and the @kiwi/core workspace's exports map from them: a change to another package, a script, the Electron build settings in desktop/package.json or a desktop-only dependency in bun.lock doesn't reach the app or its tests.

  release-rehearsal:
    name: release / rehearsal
    jev: false
    push: false
    version_bumps: true
    inputs: []
    always:
      - ".github/actions/stamp/action.yml"
      - ".github/workflows/release-build.yml"
      - ".github/workflows/release.yml"
      - "CHANGELOG.md"
      - "desktop/build/entitlements.app.plist"
      - "desktop/build/entitlements.cli.plist"
      - "desktop/electrobun-pins.json"
      - "desktop/electrobun.config.ts"
      - "desktop/native/linux/**"
      - "desktop/native/macos/kiwi-shell.m"
      - "desktop/package.json"
      - "desktop/scripts/appimage-squashfs.ts"
      - "desktop/scripts/eb-app.ts"
      - "desktop/scripts/eb-driver-check.ts"
      - "desktop/scripts/eb-home-keychain.ts"
      - "desktop/scripts/eb-linux-start.sh"
      - "desktop/scripts/eb-pins.ts"
      - "desktop/scripts/eb-post-build.ts"
      - "desktop/scripts/eb-pre-build.ts"
      - "desktop/scripts/eb-release.ts"
      - "desktop/scripts/eb-test-marks.ts"
      - "desktop/scripts/eb-update-rehearsal.ts"
      - "desktop/scripts/eb.ts"
      - "desktop/scripts/fuses.ts"
      - "desktop/scripts/linux-files.ts"
      - "desktop/scripts/linux-packages-check.sh"
      - "desktop/scripts/linux-upgrade-check.sh"
      - "desktop/scripts/mac-size.ts"
      - "desktop/scripts/pack-cli.ts"
      - "desktop/scripts/package-linux.ts"
      - "desktop/src/signer.ts"
      - "desktop/src/update-asset.ts"
      - "scripts/build-cli.ts"
      - "scripts/changelog.ts"
      - "scripts/cli-downloads.ts"
      - "scripts/stamp.ts"
      - "src/version.ts"
    description: >-
      Runs .github/workflows/release-build.yml, the build a tag's release.yml runs, with rehearsal: true and a read-only token, publishing nothing: scripts/stamp.ts stamping the tag after src/version.ts (stamp.ts --next, v0.20.6 after 0.20.5) into src/version.ts, both package.json files and site/app.js and site/README.md's download names, and writing CHANGELOG.md's section from the commits since the last release tag, as a tag does; the version and changelog checks on the stamped tree; every job below building that tree (the .github/actions/stamp action applies the stamp the version job uploads); the cli job on macOS (bun test, four builds, each packed as .gz and .xz, held to 30 MB by scripts/cli-downloads.ts), and Electron's app packaged only for Intel Macs (x64:
      Apple silicon and Linux ship the Electrobun app, T445; #950 keeps Electron for Intel), its contents and fuses checked (release/mac/Channels.app), the kiwi binary bundled zstd-packed by desktop/scripts/pack-cli.ts (which checks it unpacks to the same bytes), and desktop/scripts/mac-size.ts failing a dmg or zip over 150 MiB or an app over 320 MiB.
      The desktop-mac-eb job (every rehearsal and every tag, T445) builds dist/kiwi.js (scripts/build-cli.ts --js; eb-post-build copies it into the app, which installs the kiwi CLI from it, T2317), then the Electrobun app with the release bundle id (CHANNELS_EB_RELEASE=1) through the pinned toolchain, then desktop/scripts/eb-release.ts unpacks the plain Channels.app from the build's payload, fails unless it is com.kiwiinit.channels at desktop/package.json's version, signs every Mach-O, re-seals the app (T544's KiwiSeal, which skips the stapled Contents/CodeResources) and then signs the bundle, all with the Developer ID and the hardened runtime (Bun alone gets entitlements.app.plist's allow-jit), notarizes and staples it, zips it with ditto (Channels.app at the zip's root) under the name the Electron updater asks for (update-asset.ts swapAsset:
      Channels-<version>-mac-arm64.zip), makes a ULMO dmg with an Applications link, signs, notarizes and staples that, and fails on a binary carrying audio-input, camera, disable-library-validation, allow-dyld-environment-variables or disable-executable-page-protection, on a designated requirement that isn't Developer ID for com.kiwiinit.channels (signer.ts developerIdRequirement), on codesign --verify, stapler or Gatekeeper refusing the app or the dmg, on a shipped file that no longer matches the seal (eb-seal.ts sealProblems, after stapling), or on a dmg or zip over 40 MB; without the secrets (a pull request) it ad-hoc signs and skips notarization.
      Then desktop/scripts/eb-update-rehearsal.ts installs the last Electron arm64 release (ELECTRON_LAST_MAC_ARM64, v0.26.0) into a temp Applications folder and runs its updater's own steps on the new zip: the asset name, the SHA256SUMS line, ditto -x, Channels.app at the root, a newer version, signedLikeThisApp (codesign -R the installed app's designated requirement, then spctl) when signed, and update-asset.ts swapScript swapping the bundle in place; it fails unless the swapped app is com.kiwiinit.channels at the new version with no leftovers, and unless it opens its window within 30 s.
      Then desktop/scripts/eb-driver-check.ts --release unpacks the zip (ditto) and mounts the dmg (hdiutil) and fails if either carries test-only code (desktop/scripts/eb-test-marks.ts) or if CHANNELS_EB_TEST is set.
      The desktop-linux-eb job builds the Electrobun app for Linux on ubuntu-24.04 (the glibc libkiwi-shell.so and bin/launcher are compiled against, the oldest Ubuntu it runs on) with the release id, packages the deb and AppImage (desktop/scripts/package-linux.ts, each at most 40 MB), runs eb-driver-check --release on both (dpkg-deb -x, --appimage-extract), desktop/scripts/linux-packages-check.sh (what each package holds and leaves out, and bin/launcher's allowlist), desktop/scripts/linux-upgrade-check.sh (the v0.26.0 Electron deb installed, then this deb over it), and starts the installed app and the AppImage under Xvfb (desktop/scripts/eb-linux-start.sh, unsandboxed on 24.04, the app saying why).
      On a pull request, and on a manual run of ci.yml from any branch but main, the macOS app is unsigned: no caller passes the signing secrets, and only the release environment (main and v* tags) holds them.
      A manual run on main takes them from that environment, so the app is signed, notarized and checked as on a tag.
      Fails where the tag would: a stamped file with no version for the stamp to find, versions that disagree after it, no changelog section, a test failing on macOS, an electron-builder error, a package missing the web app or the kiwi binary, a Mac package over its size gate, a Linux package over 40 MB or missing what it must hold, test-only code in what ships, the deb not installing over the Electron one, the Linux app not starting, and on a manual run on main a signing or notarization error.
      Runs on a pull request that changes the release workflows, the stamp or CHANGELOG.md, on any change that only bumps a version number, and on manual runs of ci.yml, never on a push to main (release.yml's "kiwi X.Y.Z" stamp commit included).

