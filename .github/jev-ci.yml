p app's New agent modal, its computer picker with a paired computer chosen, and its started screen (with a stand-in for the launch methods the desktop bridge adds), first run, signed in with nothing open, Join with a code and the invite preview; last, so no other screen has rooms, the owner makes #mobile and atlas posts once in #general and twice in #mobile (one an @mention of the owner) while #general is open: the sidebar's per-room unread counts (T1236).
      The shots are uploaded as the ui-shots artifact, WebKit's as ui-shots-webkit.
      Fails when the conversation isn't at its newest message (within 80px of the bottom) once the channel opens and again back from the Tasks tab (which it visits itself), at the wide size and, in the same run (--phone channel,tasks: the channel and Tasks screens on the channel already seeded), at phone size too (web/src/components/conversation/use-scroll.ts), or when the window's drag band would take a control of the open viewer (each app-region box added or taken away in document order, as Electron does), or when the seeding can't drive the dashboard or any screen can't be reached (a control renamed, moved or gone), so the shots keep up with the UI; each of these in either engine, so a screen or the conversation's place that works in Chromium but not in WebKit fails too.
      Headless Chromium and the apt packages it needs come from .github/actions/browser, which installs the packages from .deb files cached for this very runner image (and Playwright's browsers cached per Ubuntu release, since its WebKit is built for one) and fails the job if they can't be installed.

  perf:
    name: perf / scale
    inputs:
      - "desktop/**"
      - "packages/core/**"
      - "scripts/local-relay.ts"
      - "scripts/perf-budgets.json"
      - "scripts/perf-calibrate.ts"
      - "scripts/perf-check.ts"
      - "scripts/perf-feel.ts"
      - "scripts/perf-scale.ts"
      - "src/relay/**"
      - "web/**"
    always:
      - "bun.lock"
      - "package.json"
      - "scripts/local-relay.ts"
      - "scripts/perf-budgets.json"
      - "scripts/perf-check.ts"
      - "scripts/perf-feel.ts"
      - "scripts/perf-scale.ts"
      - "web/package.json"
      - "web/vite.config.ts"
    imports_from:
      - "scripts/perf-feel.ts"
      - "scripts/perf-scale.ts"
    parts:
      - "perf-runs"
    description: >-
      Three perf-runs jobs, side by side on their own runners, each build the web dashboard and run scripts/perf-scale.ts --gated once without the soak (only what perf-check gates: no 1x tab switches, details toggles, profiles or second reload; the nightly runs it whole): a local relay and headless Chromium with 10 agents, 100 tasks and 2000 messages (the agents join at once and the seeding sends through each agent's own session, src/agent.ts, on a local relay started with --dev-no-rate-limits, so no per-minute cap slows it), timing the reload to the first screen (the conversation a channel opens on, down to the last message seeded), the Tasks, Agents and Conversation tabs at 4x CPU and typing while the agents post (their burst sent through those same in-process sessions, so no ten CLI start-ups compete with the browser for the CPU; the p95 is over every key event typed, those under 16 ms, which Event Timing doesn't report, counted at 16), then run scripts/perf-feel.ts with PERF_RTT_MS=150 (one channel of 400 messages and 12 tasks behind a proxy that delays HTTP and the WebSocket by half the round trip each way: reload to the first screen, Enter to an empty composer and to the bubble, layout shift switching Tasks / #general and opening tasks, false screens like Add an agent during five reloads, frames over 33 ms scrolling the channel), and upload both as the perf-scale-N artifact (overwrite: a re-run of a run job replaces it, so perf / scale reads the new measurement), perf-scale's with a CPU calibration (a fixed in-page workload) at 1x and 4x.
      A run that crashes fails its job.
      Then perf / scale downloads the three runs, and scripts/perf-check.ts tells the perf-feel runs apart by their rttMs and grades their medians unscaled (their timings wait mostly on the round trip; shifts and screens aren't times), and scales each perf-scale timing by its run's calibration to the reference runner in scripts/perf-budgets.json (Reload only its in-page first screen; a run whose calibration is out of the ranges there is left out and named, and fewer than two usable runs fail the scaled gates), takes the medians and fails when one is over its gate there (a ratchet: each gate starts at today's median plus 20% and comes down to its 0.20 budget as fixes land), writing the table and the gaps to the 0.20 budgets to the job summary and a perf-scale comment on the pull request.
      The soak's memory slopes are gated by the nightly workflow (.github/workflows/nightly.yml), not here.
      Headless Chromium and the apt packages it needs come from .github/actions/browser, which installs the packages from .deb files cached for this very runner image (and Playwright's browsers cached per Ubuntu release, since its WebKit is built for one) and fails the job if they can't be installed.

  desktop:
    name: desktop / package
    inputs:
      - "bun.lock"
      - "desktop/**"
      - "package.json"
      - "packages/core/**"
      - "scripts/build-cli.ts"
      - "scripts/cli-bundle.ts"
