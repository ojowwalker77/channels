      And test/base64.test.ts: core's base64 decoding (fromB64url, fromBase64) gives back every byte value and every length up to 64 through both alphabets, padded or not, and bad input still throws.
      And web use-window.test.ts: the conversation's mounted rows drop back to the newest window once they pass twice its size and the cut is above the view, and away from the conversation (Tasks or Agents) they shrink to the newest 40, so switching back mounts only a first screen.
      And test/history-bytes.test.ts: against a local relay, history pages stop at PAGE_BYTES (with at least one message each) and still return every message, and a body over MAX_BODY_LENGTH is refused at send instead of lost at read.
      And test/github-app.test.ts also: connecting a repo takes the owner's linked GitHub token and push access, and that token is used for the one GET /repos check only.
      And test/replay.test.ts: a signed message counts once and near the time it was signed (fold refuses a second copy of a message id, across incremental folds and their snapshot, and one signed more than a day before the relay received it).
      And test/hardening.test.ts's unverified rows (A3): a key the relay lists as a member without a record the owner signed stays out of the roster every fold reads (rosterOf in packages/core/src/state/types.ts for agents and snapshots; the web drops the same rows), so a post under its unverified-<pk6> name folds as forged and reaches no agent, while the owner's members() still lists it to remove and updateScopes, updatePersona, updateRole and updateNickname refuse to sign it a record.
      And test/prism.test.ts: prism means one thing (prism-lit only on the open channel and the sidebar's chosen view or conversation, test files that check it aside, no plain prism or orb anywhere, solid prefers-contrast fallbacks, the spectrum and segment tokens written once, the kit the quiet look).
      And test/desktop-update-check.test.ts:
      Settings' check for updates (desktop/src/updater.ts's checkForUpdate, with a fake host and fetch): the latest release says current, a pre-release or draft never counts, an unpackaged app only offers the release link and downloads nothing, GitHub failing is a failed check, and two checks at once share one.
      And test/desktop-calls.test.ts: window.kiwi's calls and the main process's handlers as one typed table (desktop/src/calls.ts, host.ts, ipc/handlers.ts, on a fake host and an in-memory store, electron never loaded): every bridge call goes out under its own name with its arguments and main has exactly one handler for each, every on* hears only its own push and getSnapshot follows the store's, and the handlers reach the shell only through the Host seam (the folder picker, notifications, the update restart, the browser only for http(s) links, a new relay saved, told to the keys and the page reloaded, a bad one changing nothing, a bad argument refused under the call's name).
      And test/desktop-cli.test.ts: the app's kiwi.js becomes a working kiwi in the install folder, compiled by a child of the running Bun with --no-macros (a kiwi.js with a macro is refused and the macro never runs) and signed ad-hoc on macOS, a current one is kept, a kiwi.js that doesn't build leaves nothing behind, with only kiwi.js in the app the daemon's own copy is compiled into the app's data, never the .js handed back, and every kiwi the app runs (the check of a new build, its version, its cleanup), started from a helper holding an open fd 3 and KIWI_KEY_FD, BUN_OPTIONS, NODE_OPTIONS and LD_LIBRARY_PATH, sees none of them and loads no bunfig.toml or .env from the folder it runs in (desktop/src/cli.ts keepCli, bundled-daemon.ts kiwiCli, T446, T1062).
      And test/desktop-child-env.test.ts: a child of the app gets only the names desktop/src/child-env.ts childEnv keeps (PATH, HOME, the locale, the desktop session, proxies, KIWI_* and the like; never LD_*, DYLD_*, BUN_*, NODE_OPTIONS or KIWI_KEY_FD), the person's browser keeps their session minus those switches (sessionEnv), and, bundling desktop/src/main-eb.ts and channels.ts and parsing the result with oxc-parser, every spawn they can reach (child_process's spawn, execFile and the rest, and Bun.spawn, whose default is Bun's startup environment with KIWI_KEY_FD still in it) passes an env built by childEnv or a builder on it, with no spawner passed on unchecked (T1062).
      And test/desktop-eb-bridge.test.ts: the Electrobun bridge's own rules (desktop/src/eb-bridge.ts): only views://internal/index.html counts as our page whatever its hash, main's script reaching our receiver through window (which page script can't replace) rather than globalThis, a frame read as its page load's session id and packet, the preload's boot read as the snapshot plus main's session for that load, nothing in or out while the view is off our page, a call that isn't the bridge's (__proto__, constructor and the like) or not given as a list never reaching a handler, the preload carrying the snapshot and packets going only to our own receiver, and every Electrobun internal RPC handler but window dragging doing nothing (webviewTagUpdateSrc, SetNavigationRules and ExecuteJavascript included); with test/desktop-eb-bundle.test.ts: the post-build check of the built bundle, including the key channel taken before any other code (inert preambles pass; a call, a static class initializer, an IIFE, a callback that runs code, an assignment to a global, a loop or a non-builtin import fail), and main-eb.ts bundled with Electrobun stubbed passing while the same bundle with a spawning import put above it fails (T1710).
      And test/desktop-app-life.test.ts: the Electrobun app's single instance (desktop/src/single-instance.ts: an exclusive flock on app.lock in the data folder, opened O_CLOEXEC so a child left running never keeps it, and dropped by the kernel with the process; a second start hands its kiwi:// link (kiwi:// only) or "show" over app.sock, 0600 in the data folder it chmods 0700, and goes; two first runs at once leave exactly one first; a socket that answers only a well-formed handoff under 4 KB), the wake nudge by timer drift (desktop/src/wake.ts) and the tray and app menus as data (desktop/src/app-menus.ts:
      Restart to update only when one is ready, the text sizes on ⌘0, ⌘= and ⌘-, only the app's own actions read back from a click).
      And test/desktop-shared-modules.test.ts: the modules both desktop shells share (ipc/handlers.ts and everything it imports, calls.ts, host.ts, store.ts, updater.ts, bundled-daemon.ts, deep-links.ts, main-log.ts, page-crash.ts, signin.ts, and the keys' keys-host.ts, keys-eb.ts, keys-shim.ts and keys-page.ts) never import electron however deep the import, read from their real import graph, while the Electron shell's own electron-host.ts and main.ts still do.
      And test/desktop-keys-eb.test.ts: the Electrobun app's keys on a Bun Worker (desktop/src/keys-eb.ts, T437), on a fake Worker and clock: init first, requests made before the Worker is up queued and sent over one port for their page, a push to the page with its session, a reload's new session closing the old port, the Worker's asks answered by the host (keys-host.ts, shared with Electron's keys-process.ts) and an answer for a Worker that has gone dropped, a Worker that dies giving waiting requests the restart error and coming back after 2 s, 4 s ... up to 30 s (1 s again after a minute up), with a fresh port and a restart frame for the page, and quitting flushing (ended once it says flushed, or after 1 s) with nothing restarted, and a quit during the restart wait answering what a page asked meanwhile with "Channels is quitting"; with test/desktop-keys-worker.test.ts: the real keys-worker.ts in a Bun Worker, channels.ts unchanged behind keys-shim.ts's process.parentPort, answering a page's request, writing its memory on flush, and started again after it ends; and test/desktop-keys-page.test.ts: the page's KeysPort over the RPC (keys-page.ts), each request numbered and sent with the page's session, frames from another session dropped, and a refused RPC an unreachable reply.
      And test/desktop-github-relink.test.ts: a page that presses Link while a GitHub link runs (as after a reload) joins the same flow and gets that flow's device code again (desktop/src/ipc/github.ts, with fetch and the browser faked).
      And test/desktop-store-open.test.ts: a store vault whose load throws partway leaves the store broken, so no later change saves defaults over either copy (desktop/src/store.ts openStore), as does a load that fails with an empty reason or throws an error with no message, the thrown error goes to main.log, and a store that opens fine after a broken one is writable again.
      And test/jev-ci.test.ts: the CI planner in .github/jev-ci, which plans synthetic changes against the real .github/jev-ci.yml and .github/workflows/ci.yml in a scratch git repo, following imports into workspace packages (@kiwi/core) by name, and trusts a pass marker only from main, the merge queue's gh-readonly-queue/main/ refs or the pull request's own runs, never a fork's; a merge group is planned on its combined base..head change, a group event without a base_sha and head_sha fails the plan (so everything runs), a push to main runs nothing only when a successful merge_group run of ci.yml has that very sha, and ci.yml runs on merge_group with a concurrency group per merge group (T2034).
      And test/core-package.test.ts: packages/core imports nothing outside itself but effect/*, node: builtins only under packages/core/src/node, no Node or Bun globals elsewhere in it, web/src never imports @kiwi/core/node/, and nothing reaches packages/core by a relative path.
      And test/slots.test.ts: task claims and `kiwi answering N` are compare-and-set on a local relay (two racing claims or markers: exactly one lands, the loser is told who holds it and leaves nothing in the log; a drop frees the claim; a marker doesn't answer an ask), and the relay refuses a malformed slot with 400 and someone else's slot with 423 Taken.
      And test/leases.test.ts: leases with a line (kiwi lock/unlock): the first to ask holds it, the rest wait in log order, letting go or running out hands it to the next, waits give up, only a person frees someone else's, a snapshot-resumed fold agrees, status shows it and no one is woken by it, and two agents racing over a local relay end with one holder and one waiting.
      And test/quiet.test.ts: which events are live state (notes, leases, claims, reactions, joins, cards) and stay out of the conversation and kiwi log, and which people still read there.
      And test/lead.test.ts: the optional lead role (one at a time, an old coordinator role reads as it, an old mode.set folds to nothing, a person's words reach every agent).
      And test/push-pull.test.ts: what an agent is sent (all of #general, rooms and task threads once it has posted there, so an answer to its question in a task's thread reaches it, and @mentions anywhere) and how a mention is read.
      And test/compact.test.ts: /compact (a proposal names every open task and question; only the owner compacts; done tasks archive off the board; a snapshot-resumed fold agrees; propose and approve over a local relay).
      And test/where.test.ts: kiwi send --to WHERE (one word for #general, a room, a task, a direct thread or a reply; names beside it; two places refused).
      And test/papercuts.test.ts's near-duplicate titles: task add's "looks like T…" hint, where two titles whose identifiers differ at all (each kept whole: an optional letter prefix, then digits with their . or - groups and a trailing letter, so abc-81 reads as abc81, 1.2, 2026-10-12 and abc81a are one each, and v0.20 is 0.20) never look alike, and a word-overlap match needs two shared words.
      Fails if a tested module's behavior, output text or exported names change.
      TMPDIR points through a symlink, as macOS's does, so a test that compares a tmp path with its realpath or process.cwd() fails here too.
      The Claude Code permission hook (test/permission-hook.test.ts, test/permission-call.test.ts): kiwi hook permission, run with a PermissionRequest on stdin against a local relay, asks the agent's human from the seat recorded for that exact session, takes only their signed answer bound to the ask's payload id (the owner may Deny, never Allow; a typed "Allow once" is ignored), prints Claude Code's allow or deny, and says nothing but closes the ask when the call settles in the transcript first; no seat for the session or a subagent's call asks nobody.
      The transcript watcher finds the newest unanswered matching tool_use and sees its tool_result, a new prompt or a new assistant turn. test/permission-session.test.ts: one hook waits per session and a later prompt marks it as overtaken, judged by the Date.now() the mark holds, not its file time (Linux dates files by a coarser clock that can read a few ms earlier); a lock file still being written counts as held, a stale one doesn't; letting go leaves another hook's lock and its newer-prompt mark alone; the folder shown starts with ~.
      An answer the fold doesn't have yet is read again a bounded number of times and decided only on the fold's copy (test/permission-hook.test.ts), and the hook's own wait reads it that way (test/permission-ask.test.ts, askPermission on a fake session whose fold lags the frame); a newer prompt that starts while the wait winds down gets nothing printed for the old one, and neither does an answer in the terminal then, since the last check runs after the wait has closed; a signal after the wait has closed closes the ask instead of killing the hook. test/permission-lock.test.ts (node:fs wrapped to act at the exact moment): a stale lock swapped for a live or still-written one just before the takeover stays with that hook, a newer hook that takes the session while the lock is set aside keeps it, and letting go removes the newer-prompt mark before the lock. test/ios-view.test.ts: the iPhone app's room view (ios/engine/view.ts, the engine's roomView on a folded signed log): a task in review that the person may approve is in its reviews, done by the task's owner and dated by its open round, one waiting on an agent reviewer isn't, an agent's seat gets none, and the channel's latest line is its newest message outside the chat with the lead (a task thread's, with the thread it was said in), #general's when nothing came after it.
      And the Electrobun shell's page and pins: test/desktop-eb-page.test.ts (desktop/src/eb-page.ts: the CSP meta first in a <head> found by the page's structure, with only HTML's whitespace (tab, LF, FF, CR, space) allowed before it, so a non-breaking space or a vertical tab is refused; the navigation rules and the one page they allow; will-navigate read as the page, a refusal or a breach) and test/desktop-eb-pins.test.ts (desktop/scripts/eb-pins.ts and desktop/electrobun-pins.json: the pins moving with the electrobun dependency, a host without pins refused, a changed or missing file named, a tree hash over every path and byte).
      Fails if any of that breaks.

  test-flows-a:
    name: test / flows-a
    inputs:
      - "packages/core/**"
      - "src/**"
      - "test/owner-cli.ts"
    imports_from:
      - "test/budget-*.test.ts"
      - "test/cache-trim.test.ts"
      - "test/e2e.test.ts"
      - "test/reconnect.test.ts"
      - "test/threads.test.ts"
      - "test/verbs.test.ts"
    always:
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "scripts/ci-flows.ts"
      - "scripts/ci-shards.ts"
      - "scripts/ci-tests.ts"
    description: >-
      On two runners at once (`scripts/ci-tests.ts flows-a --shard=N/2`, dealt by test/timings.json, a jev-ci pass per shard), runs slow end-to-end tests (failing when the run ends before every file ran) that start a real local relay (src/relay/bun.ts) and drive the kiwi CLI and client: e2e (create a channel, join, send and listen through the relay), verbs (the agent CLI verbs and their aliases; an agent's task add without --ask, --from or --issue refused with the fix named, and kiwi task listing the board under the person's message each task serves; review rounds: an agent's task review on a task with no reviewer is refused with how to name one, and its reviewer handing the review on with task review --review NAME keeps the open round and its commit and tells the new reviewer which round; an agent's reply that runs past six lines in #general is told to keep #general to a line or two and put the detail in the task's thread), threads (task threads and direct threads), reconnect (what a listener says when the relay drops).
      Then every test/budget-*.test.ts: budget-relay counts the SQL statements a stored message, a read mark and a connecting socket cost on one Durable Object storage handle; the others drive clients through test/traffic.ts, a proxy that counts HTTP requests by route, sockets, frames and bytes. cache-trim: past 800 messages a session keeps a local fold base and trims cache/<room>.jsonl to the newest 300 (src/agent/state.ts, src/config/cache.ts), and tasks, charter and log read the same from base and tail as from the full log.
      Fails if the CLI, the client, the relay, the protocol or the text they print changes behavior, or an operation costs more requests, frames, bytes or statements than its budget.

  test-flows-b:
    name: test / flows-b
    inputs:
      - "packages/core/**"
      - "src/**"
      - "test/owner-cli.ts"
    imports_from:
      - "test/daemon-pair.test.ts"
      - "test/handoff.test.ts"
      - "test/held-seat.test.ts"
      - "test/hooks-hung-relay.test.ts"
      - "test/hooks-once.test.ts"
      - "test/hooks-persona.test.ts"
      - "test/hooks-reentry.test.ts"
      - "test/join-seats-hooks.test.ts"
      - "test/join-seats-review.test.ts"
      - "test/join-seats.test.ts"
      - "test/loop-flows.test.ts"
      - "test/mimo-wake-restart.test.ts"
      - "test/multi-seat.test.ts"
      - "test/offline-read.test.ts"
      - "test/read-receipts.test.ts"
      - "test/reclaim.test.ts"
      - "test/seats.test.ts"
      - "test/sh-escape.test.ts"
      - "test/wake-yourself.test.ts"
    always:
      - "bun.lock"
      - "bunfig.toml"
      - "package.json"
      - "scripts/ci-flows.ts"
      - "scripts/ci-shards.ts"
      - "scripts/ci-tests.ts"
    description: >-
      On two runners at once (`scripts/ci-tests.ts flows-b --shard=N/2`, dealt by test/timings.json, a jev-ci pass per shard), runs slow agent-flow tests (failing when the run ends before every file ran) against a real local relay and the kiwi CLI: join-seats (joining, one seat per agent, Claude Code hooks doing the listening, and a Codex hook run from inside a Claude Code session, its CLAUDECODE and CLAUDE_CODE_SESSION_ID inherited, serving no Claude seat and leaving that seat's messages unread because the hook names its harness with --harness), read-receipts, daemon-pair (kiwi pair through the relay's pairing mailbox: src/daemon/pair.ts, src/machine.ts, packages/core/src/mailbox.ts), sh-escape (the sandboxed kiwi sh), reclaim, wake-yourself (the Stop hooks that keep a Kimi Code, Grok or Cursor agent's listener running, and a Kimi Code session that Kimi's server hosts woken through that server: the busy session recorded at join, kept current by the Stop hook, the prompt posted with the server's token; src/kimi-server.ts; for Cursor, its stop hook known by conversation_id and cursor_version, its seat by CURSOR_CONVERSATION_ID, and a listen --once of that chat counting as armed; a Grok Bot whose VM's shell has CURSOR_AGENT seated and hooked as Grok Bot, not Cursor; and with a backlog of unread messages the stop reason, re-arm reminder included, stays within the seat's share of the hook limit).
      Then seats and multi-seat: which agent a command or hook acts for in a folder (a reply goes to the channel the session heard the message in, even from a folder bound to one seat)
      (src/seats.ts, a Grok Bot's seat from its VM's hostname or KIWI_HARNESS, a hook's named harness over the markers its parent session left: hereAs, and a named harness with no session never given a folder's only seat when that seat is another harness's or a live session's), one session holding seats in two channels, the join of the second from the same folder saying which -c ALIAS --as NAME picks each seat and a rejoin of either saying nothing about it (src/cli/commands/join.ts), each Stop and SessionStart unread header and Cursor follow-up naming its channel (src/hooks/answer.ts, test/wake-yourself.test.ts), a session that holds neither seat told the folder has seats in both channels and to pass -c ALIAS --as NAME (src/cli/context.ts), hooks serving the right seat from sibling folders, and with a backlog on both seats each hook's whole output (SessionStart, prompt, stop) within HOOK_CONTEXT_MAX, the seats sharing it (src/hooks/run.ts).
      Then handoff: an escalation's live browser link (packages/core/src/protocol.ts), `kiwi send --escalate --handoff URL --wait` exit codes, and the link kept out of log, show, listen --json except `kiwi show N --reveal`, and only a person's done or couldn't ends the wait, never an agent's (src/agent/messaging.ts); kiwi ask-human --holds T7,#18 --kind K naming the tasks and asks a decision holds up (refused for one that's neither), printed back as what it holds, shown in kiwi status as `[kind] · holds …`, and one holding nothing told it goes to the digest and listed there, not as waiting on you.
      Then hooks-once: a message the prompt or stop hook hands over never wakes the session a second time from the listener started with it (src/hooks/listen.ts waits for the session's answering hook, src/hooks/delivered.ts), and the listener keeps listening for the next one; and a prompt hook whose output never reaches the session leaves the message unread for the next hook (src/hooks/run.ts commits what was read only after printing it), and a hand-over cut at its size limit commits only the messages shown, so the next hook brings the rest; and after a /clear (a new session id in the same process) the earlier session's listener hands a message over once and the new session's stop and prompt hooks don't hand it over again, nor does its listener started before any hook; and a listener that can't reach the daemon keeps retrying its slot (2s doubling to 60s) while its session lives, instead of exiting and leaving the session deaf.
      Then hooks-hung-relay: with the relay accepting connections but never answering, the prompt and stop hooks each return in under 2s (src/hooks/run.ts puts the whole hook under one deadline; packages/core/src/client/relay.ts gives every relay request 30s), and what they couldn't show comes with the next prompt.
      Then offline-read: with the relay down, kiwi log and kiwi tasks show the messages and tasks this computer already had and say the relay can't be reached (OfflineReads in packages/core/src/client/relay.ts, src/agent/state.ts, src/cli/context.ts).
      Then hooks-persona: when the owner gives a seated agent a personality, changes it or takes it away mid-session, its next prompt or Stop hook tells it once, before its messages (src/hooks/persona-line.ts, src/hooks/answer.ts), and a new session reads it in its SessionStart brief and isn't told again.
      Then hooks-reentry: a SessionStart hook for a session that starts fresh (startup, clear, compact) tells the agent its open task and the checkpoint saved with kiwi task checkpoint, and one for a resumed session doesn't (src/hooks/answer.ts, packages/core/src/reentry.ts); kiwi task checkpoint lead refuses a seat that isn't the lead and an empty note before sending anything (src/cli/commands/tasks.ts); with big checkpoints and a backlog of messages the SessionStart context stays within HOOK_CONTEXT_MAX (Claude Code's inline limit, shared between the seats a session serves in src/hooks/run.ts), and every message it left out comes with a later hook; and with kiwi context-line off (src/cli/commands/context-line.ts, the default) the context line says nothing: no checkpoint line in the brief, a checkpoint only saved, no Stop ask; with it on, everything as it was before #670: past the context line the Stop hook asks once for a checkpoint of each open task, not while stop_hook_active, and again only after the context came back under it (src/hooks/context-line.ts); and a seat made lead past the line is asked for its lead checkpoint, has a checkpoint that leaves out an open task refused, and its fresh session is shown the one it saved (src/hooks/answer.ts, src/cli/commands/tasks.ts).
      Then mimo-wake-restart:
      Kiwi's MiMoCode plugin (src/hooks/install/mimo.ts) loaded against a real listener, whose wake MiMoCode keeps refusing until MiMoCode exits mid-retry; the resumed session still gets those messages, because the listener writes a pending handoff per token (src/hooks/delivered.ts) that becomes the delivered marker only when the plugin's next listen names the token of the wake that landed (src/hooks/listen.ts, src/hooks/run.ts), and the next message isn't repeated with them; a wake the listener hands MiMoCode logged to wake.log as handed, and the refusals before it landed (the plugin's next listen reports their count and last error) logged as failed with that reason (appendWakeRow in src/daemon/wake.ts, src/hooks/listen.ts); and two MiMoCode processes on one session, each landing its wake of the same message, count it delivered once instead of clearing each other's handoff and waking it back and forth.
      Then held-seat: a seat a loop holds with kiwi seat hold (src/hold.ts, src/cli/commands/seat.ts) keeps only a hash of the loop's KIWI_SEAT_TOKEN and drops its session; while it is held no hook takes it or hands it anything (seatsFor in src/seats.ts), every kiwi command for it from another session refuses, --as, KIWI_AS and kiwi use included (src/cli/context.ts, src/cli/commands/channel.ts), a kiwi listen already running for it exits on the next message without printing it or moving the cursor (src/agent/listen.ts, src/agent/state.ts), and an MCP server started before the hold answers every tool, wait_for_messages and sh included, with the refusal and with the cursor where it was (src/mcp.ts, src/sh.ts), while the token's holder still acts as it; bind refuses a Grok Bot and a Kimi Code seat without its process; kiwi seat bind hands it to the Claude Code session it names, which is told what arrived during the hold, and the old session gets nothing; and a kiwi listen of the bound session that heard nothing during the next hold exits on the first message after the seat goes to a third session, which gets that message (the holds count in src/hold.ts).
      Then loop-flows: kiwi loop (src/loop/run.ts, src/cli/commands/loop.ts, src/loop/recipes.ts) holds its seat, starts a fake Claude Code for a task the seat owns with the window's model, KIWI_CHANNEL and KIWI_AS, without KIWI_SEAT_TOKEN or the outer session's markers, and a first prompt that names the task and how it ends (src/loop/work.ts); binds the seat to the session in its process's registry (src/loop/claude.ts); once the session marks the task done, holds the seat again, ends the idle session with SIGTERM, and releases the seat when the loop is stopped; and with --harness codex, run from a shell that still has an outer CODEX_THREAD_ID, starts a fake Codex with -m and the effort as a config override, finds its new thread by the launch nonce in the rollout's first prompt (src/loop/codex.ts), binds the seat to that thread, and ends it once the rollout says the turn is over; and with --harness grok, starts a fake Grok whose first prompt also asks for a kiwi listen monitor, binds the seat to the session in the loop's folder that holds the nonce (src/loop/grok.ts), and ends it once its update stream says the turn is over; and with --harness mimo, refuses --effort, starts a fake MiMoCode with the model chosen in its model.json, binds the seat to the session its database holds with the nonce (src/loop/mimo.ts), and ends it with SIGINT, which MiMoCode stops on, not SIGTERM; and with --harness kimi, refuses to run outside tmux, then in a private tmux server clears the pane, waits for a fake Kimi's ready screen with bracketed paste on (the fake turns it on a second after drawing the screen), pastes the first prompt with bracketed paste and Enter, binds the seat to Kimi's process, ends it once its wire log says the turn ended, and stops the kiwi listener it left running (run only on tmux 3.7 or newer, which reports bracketed paste, so skipped on the Linux runner's tmux 3.6a and run where a newer tmux is installed); and with a fake tmux 3.6a, kiwi loop --harness kimi refused up front with the version it found.
      Fails if joining, seats, hooks, pairing, the daemon, kiwi sh, handoff, the held seat, the loop or the relay change behavior.

